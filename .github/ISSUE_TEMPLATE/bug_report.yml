name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **do not** paste secrets, cookies or
        personal data. For security issues, use private reporting instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. eroica new -b firefox -p test --tier strict
        2. eroica launch -b firefox -p test
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `eroica doctor --json`
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EROICA version
      description: Output of `eroica version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - standard
        - strict
        - paranoid
        - not applicable
    validations:
      required: true
